<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻简天气 - 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg">
  <img src="images/bg.png" alt="背景">
</div>

<div class="wrapper">
  <div class="top-bar">
    <!-- 欢迎文字颜色已改为黑色 -->
    <div class="system-title" style="color: black;">欢迎使用轻简天气系统</div>
    <div class="user-info">
      <img src="images/tx.png" class="avatar" alt="头像">
      <span id="userNameDisplay">用户</span>
    </div>
  </div>

  <div class="nav">
    <a href="main.html">首页</a>
    <a href="city.html">城市天气</a>
    <a href="detail.html">天气详情</a>
    <a href="feedback.html">意见反馈</a>
  </div>

  <div class="card">
    <div class="top">
      <!-- 默认城市已从广州改为襄阳 -->
      <div class="location">襄阳市</div>
      <div class="time">今日天气</div>
    </div>
    <div class="middle">
      <div class="temp">22°</div>
      <div class="weather">
        <img src="images/rain.png" alt="小雨" class="weather-icon">
        <div class="text">小雨</div>
      </div>
    </div>
    <div class="info">
      <div>温度 18~25°</div>
      <div>湿度 62%</div>
      <div>空气质量 良</div>
      <div>风速 3级东风</div>
    </div>
  </div>

  <div class="search">
    <input type="text" placeholder="输入城市查询">
    <button>搜索</button>
  </div>

  <div class="week">
    <div class="week-item">
      <div>周一</div>
      <img src="images/rain.png" alt="" class="weather-icon">
      <div>小雨</div>
      <div>18~25°</div>
    </div>
    <div class="week-item">
      <div>周二</div>
      <img src="images/cloudy.png" alt="" class="weather-icon">
      <div>阴</div>
      <div>17~23°</div>
    </div>
    <div class="week-item">
      <div>周三</div>
      <img src="images/cloudy.png" alt="" class="weather-icon">
      <div>多云</div>
      <div>19~26°</div>
    </div>
  </div>
</div>

<script>
document.getElementById("userNameDisplay").innerText = localStorage.getItem("userName") || "游客";
</script>
<script src="js/app.js"></script>
</body>
</html>

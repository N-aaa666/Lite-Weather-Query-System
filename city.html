<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg">
  <img src="images/bg.png" alt="背景">
</div>

<div class="wrapper">
  <div class="top-bar">
    <div class="system-title" style="color: black;">欢迎使用轻简天气系统</div>
    <div class="user-info">
      <img src="images/tx.png" class="avatar" alt="头像">
      <span id="userNameDisplay">用户</span>
    </div>
  </div>

  <div class="nav">
    <a href="main.html">首页</a>
    <a href="city.html">城市天气</a>
    <a href="detail.html">天气详情</a>
    <a href="feedback.html">意见反馈</a>
  </div>

  <!-- 页面标题 -->
  <h2 class="page-title">热门城市天气列表</h2>

  <!-- 城市天气列表 -->
  <div class="city-list-container">
    <!-- 北京 -->
    <div class="city-card-new">
      <div class="city-name">北京市</div>
      <div class="city-weather">
        <img src="images/sunny.png" alt="晴" class="weather-icon">
        <span>晴</span>
      </div>
      <div class="city-temp">28℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：28℃</span>
      </div>
    </div>

    <!-- 上海 -->
    <div class="city-card-new">
      <div class="city-name">上海市</div>
      <div class="city-weather">
        <img src="images/cloudy.png" alt="多云" class="weather-icon">
        <span>多云</span>
      </div>
      <div class="city-temp">25℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：25℃</span>
      </div>
    </div>

    <!-- 广州 -->
    <div class="city-card-new">
      <div class="city-name">广州市</div>
      <div class="city-weather">
        <img src="images/cloudy.png" alt="多云" class="weather-icon">
        <span>多云</span>
      </div>
      <div class="city-temp">35℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：35℃</span>
      </div>
    </div>

    <!-- 襄阳 -->
    <div class="city-card-new">
      <div class="city-name">襄阳市</div>
      <div class="city-weather">
        <img src="images/rain.png" alt="小雨" class="weather-icon">
        <span>小雨</span>
      </div>
      <div class="city-temp">22℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：22℃</span>
      </div>
    </div>

    <!-- 深圳 -->
    <div class="city-card-new">
      <div class="city-name">深圳市</div>
      <div class="city-weather">
        <img src="images/sunny.png" alt="晴" class="weather-icon">
        <span>晴</span>
      </div>
      <div class="city-temp">32℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：32℃</span>
      </div>
    </div>

    <!-- 成都 -->
    <div class="city-card-new">
      <div class="city-name">成都市</div>
      <div class="city-weather">
        <img src="images/cloudy.png" alt="阴" class="weather-icon">
        <span>阴</span>
      </div>
      <div class="city-temp">23℃</div>
      <div class="city-details">
        <span>发布日期：2025-05-22</span>
        <span>平均温度：23℃</span>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("userNameDisplay").innerText = localStorage.getItem("userName") || "游客";
</script>
<script src="js/app.js"></script>
</body>
</html>

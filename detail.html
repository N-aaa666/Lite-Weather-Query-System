<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg">
  <img src="images/bg.png" alt="背景">
</div>

<div class="wrapper">
  <div class="top-bar">
    <div class="system-title" style="color: #000;">欢迎使用轻简天气系统</div>
    <div class="user-info">
      <img src="images/tx.png" class="avatar" alt="头像">
      <span id="userNameDisplay">用户</span>
    </div>
  </div>

  <div class="nav">
    <a href="main.html">首页</a>
    <a href="city.html">城市天气</a>
    <a href="detail.html">天气详情</a>
    <a href="feedback.html">意见反馈</a>
  </div>

  <h2 class="page-title">未来7天天气预报</h2>
  <div class="detail-list" id="weekList"></div>
</div>

<script>
const weekData = [
  { day: "周一", weather: "小雨", icon: "rain.png", temp: "18~25°" },
  { day: "周二", weather: "阴", icon: "cloudy.png", temp: "17~23°" },
  { day: "周三", weather: "多云", icon: "cloudy.png", temp: "19~26°" },
  { day: "周四", weather: "晴", icon: "sunny.png", temp: "20~28°" },
  { day: "周五", weather: "晴", icon: "sunny.png", temp: "21~29°" },
  { day: "周六", weather: "多云", icon: "cloudy.png", temp: "20~27°" },
  { day: "周日", weather: "小雨", icon: "rain.png", temp: "18~24°" }
];

let html = "";
weekData.forEach(item => {
  html += `
  <div class="detail-item">
    <span>${item.day}</span>
    <img src="images/${item.icon}" class="weather-icon">
    <span>${item.weather}</span>
    <span>${item.temp}</span>
  </div>`;
});
document.getElementById("weekList").innerHTML = html;
document.getElementById("userNameDisplay").innerText = localStorage.getItem("userName") || "游客";
</script>
<script src="js/app.js"></script>
</body>
</html>
